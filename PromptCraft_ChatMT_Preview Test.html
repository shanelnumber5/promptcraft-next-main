<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptCraft ChatMT Test</title>
<style>
body{font:18px/1.6 Georgia,serif;color:#12355b;background:#f5f9fc;margin:0;padding:24px}main{max-width:760px;margin:40px auto;background:white;padding:32px;border-top:6px solid #f2c14e}button{background:#12355b;color:white;border:0;border-radius:6px;padding:14px 22px;font:inherit;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;font:inherit}p{margin:16px 0}
</style>
<main>
<h1>Babbage · ChatMT test</h1>
<p>Review a fictional graphic design activity using the ChatMT model configured for this preview.</p>
<p>The sample asks students to create an event flyer, use AI to explore layout ideas, and explain their design decisions in 150 words.</p>
<button id="run" disabled>Run Babbage Test</button>
<p id="status" role="status">Checking configuration…</p>
<pre id="feedback"></pre>
</main>
<script type="module">
const button = document.querySelector('#run');
const status = document.querySelector('#status');
const feedback = document.querySelector('#feedback');
const endpoint = '/.netlify/functions/chatmt-test';
try {
  const response = await fetch(endpoint);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Cannot reach the test function.');
  status.textContent = data.configured ? `Ready to test ${data.model}.` : `Missing settings: ${data.missing.join(', ')}`;
  button.disabled = !data.configured;
} catch (error) { status.textContent = error.message; }
button.addEventListener('click', async () => {
  button.disabled = true;
  feedback.textContent = '';
  status.textContent = 'Babbage is reviewing the sample…';
  try {
    const response = await fetch(endpoint, { method: 'POST' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'The test failed.');
    status.textContent = `${data.model} responded in ${(data.elapsed_ms / 1000).toFixed(1)} seconds.${data.stop_reason === 'max_tokens' ? ' The response reached its length limit.' : ''}`;
    feedback.textContent = data.feedback;
  } catch (error) { status.textContent = error.message; }
  finally { button.disabled = false; }
});
</script>
</html>
